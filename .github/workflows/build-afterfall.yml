name: Build Afterfall NeoForge 1.21.1

on:
  push:
    branches:
      - afterfall-build
    paths:
      - 'afterfall-build/chunk_*.b64'
      - '.github/workflows/build-afterfall.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: afterfall-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct Afterfall source
        shell: bash
        run: |
          cat afterfall-build/chunk_*.b64 > afterfall-source.b64
          base64 --decode afterfall-source.b64 > afterfall-source.zip
          unzip -t afterfall-source.zip
          unzip -q afterfall-source.zip

      - name: Build Afterfall
        working-directory: Afterfall
        run: gradle build --stacktrace

      - name: Publish compiled jar to build branch
        shell: bash
        run: |
          mkdir -p afterfall-build/output
          cp Afterfall/build/libs/afterfall-*.jar afterfall-build/output/Afterfall-0.1.0-NeoForge-1.21.1.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afterfall-build/output/Afterfall-0.1.0-NeoForge-1.21.1.jar
          git diff --cached --quiet && exit 0
          git commit -m 'Build Afterfall NeoForge 1.21.1 jar'
          git push origin HEAD:afterfall-build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-NeoForge-1.21.1
          path: Afterfall/build/libs/*.jar
          if-no-files-found: error
