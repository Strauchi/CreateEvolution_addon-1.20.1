name: Build Afterfall NeoForge 1.21.1

on:
  push:
    branches:
      - afterfall-build
    paths:
      - 'afterfall-build/v031_patch_gz_*.b64'
      - '.github/workflows/build-afterfall.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: afterfall-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct Afterfall 0.1 source
        shell: bash
        run: |
          cat afterfall-build/chunk_*.b64 > afterfall-source.b64
          base64 --decode afterfall-source.b64 > afterfall-source.zip
          unzip -t afterfall-source.zip
          unzip -q afterfall-source.zip

      - name: Apply Afterfall 0.2 room-system patch
        shell: bash
        run: |
          cat afterfall-build/v020_patch_*.txt > afterfall-v020.patch
          patch -p1 < afterfall-v020.patch

      - name: Apply Afterfall 0.3 bunker-systems patch
        shell: bash
        run: |
          cat afterfall-build/v030_patch_gz_*.b64 > afterfall-v030.patch.gz.b64
          base64 --decode afterfall-v030.patch.gz.b64 > afterfall-v030.patch.gz
          gzip -dc afterfall-v030.patch.gz > afterfall-v030.patch
          patch -p0 < afterfall-v030.patch

      - name: Apply Afterfall 0.3.1 airlock feedback and atmosphere-mixing patch
        shell: bash
        run: |
          cat afterfall-build/v031_patch_gz_*.b64 > afterfall-v031.patch.gz.b64
          base64 --decode afterfall-v031.patch.gz.b64 > afterfall-v031.patch.gz
          gzip -dc afterfall-v031.patch.gz > afterfall-v031.patch
          patch -p1 < afterfall-v031.patch
          grep '^mod_version=' Afterfall/gradle.properties

      - name: Build Afterfall
        id: build
        shell: bash
        run: |
          mkdir -p afterfall-build/output
          set +e
          (cd Afterfall && gradle build --stacktrace) 2>&1 | tee afterfall-build/output/build-v031.log
          status=${PIPESTATUS[0]}
          echo "$status" > afterfall-build/output/build-v031-status.txt
          exit $status

      - name: Publish build log and compiled jar
        if: always()
        shell: bash
        run: |
          mkdir -p afterfall-build/output
          if find Afterfall/build/libs -maxdepth 1 -name 'afterfall-*.jar' -type f | grep -q .; then
            JAR="$(find Afterfall/build/libs -maxdepth 1 -name 'afterfall-*.jar' -type f | head -n 1)"
            rm -f afterfall-build/output/Afterfall-*.jar afterfall-build/output/jar_chunk_*.b64
            cp "$JAR" afterfall-build/output/Afterfall-0.3.1-NeoForge-1.21.1.jar
            base64 -w 0 afterfall-build/output/Afterfall-0.3.1-NeoForge-1.21.1.jar > afterfall-build/output/afterfall.jar.b64
            split -b 8000 -d -a 2 --additional-suffix=.b64 afterfall-build/output/afterfall.jar.b64 afterfall-build/output/jar_chunk_
            rm afterfall-build/output/afterfall.jar.b64
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afterfall-build/output/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Afterfall 0.3.1 airlock feedback build'
            git push origin HEAD:afterfall-build
          fi

      - name: Upload compiled mod
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-0.3.1-NeoForge-1.21.1
          path: Afterfall/build/libs/*.jar
          if-no-files-found: error
