name: Build Afterfall NeoForge 1.21.1
# 0.9.2.3 GUI sneak-place QoL - retry after transient startup failure

on:
  push:
    branches:
      - afterfall-build
    paths:
      - 'afterfall-build/v0923_sneak_place_qol.py'
      - 'afterfall-build/v0923_trigger_*'
      - '.github/workflows/build-afterfall.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afterfall-build-v0923
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: afterfall-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Afterfall 0.9.2.3 sneak-place QoL from exact 0.9.2.2 snapshot
        id: build
        shell: bash
        run: |
          mkdir -p afterfall-build/output
          set +e
          {
            set -e
            cat afterfall-build/chunk_*.b64 > afterfall-source.b64
            base64 --decode afterfall-source.b64 > afterfall-source.zip
            unzip -q afterfall-source.zip

            rm -rf Afterfall/src/main
            cp -R afterfall-build/snapshot-v0922/main Afterfall/src/main
            cp afterfall-build/snapshot-v0922/gradle.properties Afterfall/gradle.properties
            cp afterfall-build/snapshot-v0922/build.gradle Afterfall/build.gradle

            python3 afterfall-build/v0923_sneak_place_qol.py
            grep '^mod_version=' Afterfall/gradle.properties

            cd Afterfall
            gradle build --stacktrace
          } 2>&1 | tee afterfall-build/output/build-v0923.log
          status=${PIPESTATUS[0]}
          echo "$status" > afterfall-build/output/build-v0923-status.txt
          exit $status

      - name: Publish build, log and source snapshot
        if: always()
        shell: bash
        run: |
          mkdir -p afterfall-build/output
          if [ -d Afterfall/src/main ]; then
            rm -rf afterfall-build/snapshot-v0923
            mkdir -p afterfall-build/snapshot-v0923
            cp -R Afterfall/src/main afterfall-build/snapshot-v0923/
            cp Afterfall/gradle.properties afterfall-build/snapshot-v0923/ 2>/dev/null || true
            cp Afterfall/build.gradle afterfall-build/snapshot-v0923/ 2>/dev/null || true
          fi
          if find Afterfall/build/libs -maxdepth 1 -name 'afterfall-*.jar' -type f | grep -q .; then
            JAR="$(find Afterfall/build/libs -maxdepth 1 -name 'afterfall-*.jar' -type f | head -n 1)"
            rm -f afterfall-build/output/Afterfall-0.9.2.3-NeoForge-1.21.1.jar
            cp "$JAR" afterfall-build/output/Afterfall-0.9.2.3-NeoForge-1.21.1.jar
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982343+github-actions[bot]@users.noreply.github.com'
          git add afterfall-build/output/
          if [ -d afterfall-build/snapshot-v0923 ]; then git add afterfall-build/snapshot-v0923/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Afterfall 0.9.2.3 sneak-place QoL'
            git pull --rebase origin afterfall-build
            git push origin HEAD:afterfall-build
          fi

      - name: Upload compiled mod
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-0.9.2.3-NeoForge-1.21.1
          path: Afterfall/build/libs/*.jar
          if-no-files-found: error
