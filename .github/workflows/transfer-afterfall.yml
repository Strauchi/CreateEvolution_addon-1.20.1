name: Transfer Afterfall Jar

on:
  push:
    branches:
      - afterfall-build
    paths:
      - '.github/workflows/transfer-afterfall.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: afterfall-build

      - name: Encode compiled jar for transfer
        shell: bash
        run: |
          base64 -w 1000 afterfall-build/output/Afterfall-0.1.0-NeoForge-1.21.1.jar > afterfall-build/output/afterfall_jar_base64.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afterfall-build/output/afterfall_jar_base64.txt
          git commit -m 'Add Afterfall jar transfer text'
          git push origin HEAD:afterfall-build
